{% extends 'base.html' %}

{% block description %}
  Nomes, tipos, unidades e significado das colunas.
{% endblock %}

{% block content %}
  <section class="type-summary" aria-label="Colunas por tipo">
    {% for kind, columns in schema.values()|groupby('kind') %}
      <article class="type-card">
        <strong>{{ columns|length }}</strong>
        <span>{{ kind }}</span>
      </article>
    {% endfor %}
  </section>

  <section class="panel">
    <div
      class="table-scroll"
      tabindex="0"
      role="region"
      aria-label="Dicionário completo das colunas"
    >
      {{ dictionary_table }}
    </div>
  </section>
{% endblock %}
